openapi: "3.0.3"

info:
  title: ThermoSense API
  version: "1.0.0"
  description: |
    API de gestion de la plateforme **ThermoSense** — supervision et pilotage
    du confort thermique dans des bâtiments tertiaires (bureaux, coworking, data centers).

    ThermoSense déploie des capteurs de température et d'humidité dans
    différentes zones d'un bâtiment afin de collecter des mesures en temps réel.
    Des actionneurs (ventilation, chauffage, climatisation) permettent
    d'ajuster les conditions thermiques à distance.

    L'application mobile permet aux opérateurs de :
    - Superviser l'état des bâtiments, zones, capteurs et actionneurs
    - Consulter l'historique des mesures
    - Configurer des seuils d'alerte
    - Piloter les équipements en temps réel

    ## Authentification
    Toutes les requêtes (sauf `/health` et `POST /auth/login`) nécessitent un
    token Bearer dans le header `Authorization`.

    Le token est obtenu via `POST /auth/login`.

  contact:
    name: Équipe ThermoSense
    email: api@thermosense.example.com

servers:
  - url: http://localhost:3000
    description: Local
  - url: https://api.thermosense.example.com/v1
    description: Production
  - url: https://staging-api.thermosense.example.com/v1
    description: Staging

tags:
  - name: Health
    description: État de l'API
  - name: Auth
    description: Authentification et gestion des utilisateurs
  - name: Buildings
    description: Gestion des bâtiments
  - name: Zones
    description: Gestion des zones d'un bâtiment
  - name: Sensors
    description: Gestion des capteurs
  - name: Measurements
    description: Mesures collectées par les capteurs
  - name: Actuators
    description: Gestion des actionneurs et de leurs commandes

# =============================================================================
# SECURITY
# =============================================================================

security:
  - bearerAuth: []

# =============================================================================
# PATHS
# =============================================================================

paths:

  # ---------------------------------------------------------------------------
  # Health
  # ---------------------------------------------------------------------------

  /health:
    get:
      tags: [Health]
      operationId: healthCheck
      summary: État de l'API
      description: Retourne l'état de santé de l'API. Aucune authentification requise.
      security: []
      responses:
        "200":
          description: API opérationnelle
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  # ---------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Connexion
      description: Authentifie un utilisateur et retourne un token JWT.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentification réussie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Identifiants invalides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"

  /users:
    post:
      tags: [Auth]
      operationId: createUser
      summary: Créer un utilisateur
      description: Crée un nouvel utilisateur (admin uniquement).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Utilisateur créé avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Données invalides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "403":
          description: Action réservée aux administrateurs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"

  # ---------------------------------------------------------------------------
  # Buildings
  # ---------------------------------------------------------------------------

  /buildings:
    get:
      tags: [Buildings]
      operationId: listBuildings
      summary: Lister les bâtiments
      description: Retourne la liste de tous les bâtiments.
      responses:
        "200":
          description: Liste des bâtiments
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Building"
    post:
      tags: [Buildings]
      operationId: createBuilding
      summary: Créer un bâtiment
      description: Crée un bâtiment avec son nom, son adresse et sa géolocalisation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildingRequest"
      responses:
        "201":
          description: Bâtiment créé avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Building"
        "400":
          description: Données invalides — champs manquants ou invalides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"

  /buildings/{buildingId}:
    get:
      tags: [Buildings]
      operationId: getBuilding
      summary: Détails d'un bâtiment
      parameters:
        - $ref: "#/components/parameters/buildingId"
      responses:
        "200":
          description: Bâtiment trouvé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Building"
        "404":
          description: Bâtiment inexistant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
    patch:
      tags: [Buildings]
      operationId: updateBuilding
      summary: Mettre à jour un bâtiment
      parameters:
        - $ref: "#/components/parameters/buildingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildingPatchRequest"
      responses:
        "200":
          description: Bâtiment mis à jour avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Building"
        "400":
          description: Données invalides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "404":
          description: Bâtiment inexistant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
    delete:
      tags: [Buildings]
      operationId: deleteBuilding
      summary: Supprimer un bâtiment
      description: |
        Supprime un bâtiment. Opération irréversible — supprime également toutes
        les zones, capteurs, mesures et actionneurs associés.
      parameters:
        - $ref: "#/components/parameters/buildingId"
      responses:
        "204":
          description: Bâtiment supprimé avec succès
        "404":
          description: Bâtiment inexistant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"

  # ---------------------------------------------------------------------------
  # Zones
  # ---------------------------------------------------------------------------

  /buildings/{buildingId}/zones:
    get:
      tags: [Zones]
      operationId: listZones
      summary: Lister les zones d'un bâtiment
      parameters:
        - $ref: "#/components/parameters/buildingId"
      responses:
        "200":
          description: Liste des zones du bâtiment
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Zone"
        "404":
          description: Bâtiment inexistant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
    post:
      tags: [Zones]
      operationId: createZone
      summary: Créer une zone dans un bâtiment
      parameters:
        - $ref: "#/components/parameters/buildingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZoneRequest"
      responses:
        "201":
          description: Zone créée avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zone"
        "400":
          description: Données invalides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "404":
          description: Bâtiment inexistant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"

  /buildings/{buildingId}/zones/{zoneId}:
    get:
      tags: [Zones]
      operationId: getZone
      summary: Détails d'une zone
      parameters:
        - $ref: "#/components/parameters/buildingId"
        - $ref: "#/components/parameters/zoneId"
      responses:
        "200":
          description: Zone trouvée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zone"
        "404":
          description: Zone ou bâtiment inexistant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
    patch:
      tags: [Zones]
      operationId: updateZone
      summary: Mettre à jour une zone
      parameters:
        - $ref: "#/components/parameters/buildingId"
        - $ref: "#/components/parameters/zoneId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZoneRequest"
      responses:
        "200":
          description: Zone mise à jour avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zone"
        "400":
          description: Données invalides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "404":
          description: Zone ou bâtiment inexistant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
    delete:
      tags: [Zones]
      operationId: deleteZone
      summary: Supprimer une zone
      description: |
        Supprime une zone. Opération irréversible — supprime également tous les
        capteurs, mesures et actionneurs associés.
      parameters:
        - $ref: "#/components/parameters/buildingId"
        - $ref: "#/components/parameters/zoneId"
      responses:
        "204":
          description: Zone supprimée avec succès
        "404":
          description: Zone ou bâtiment inexistant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"

  # ---------------------------------------------------------------------------
  # Sensors
  # ---------------------------------------------------------------------------

  /buildings/{buildingId}/zones/{zoneId}/sensors:
    get:
      tags: [Sensors]
      operationId: listSensors
      summary: Lister les capteurs d'une zone
      parameters:
        - $ref: "#/components/parameters/buildingId"
        - $ref: "#/components/parameters/zoneId"
      responses:
        "200":
          description: Capteurs de la zone récupérés avec succès
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Sensor"
        "404":
          description: Zone ou bâtiment inexistant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
    post:
      tags: [Sensors]
      operationId: createSensor
      summary: Créer un capteur dans une zone
      parameters:
        - $ref: "#/components/parameters/buildingId"
        - $ref: "#/components/parameters/zoneId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SensorRequest"
      responses:
        "201":
          description: Capteur créé avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sensor"
        "400":
          description: Données invalides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "404":
          description: Zone ou bâtiment inexistant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"

  /buildings/{buildingId}/zones/{zoneId}/sensors/{sensorId}:
    get:
      tags: [Sensors]
      operationId: getSensor
      summary: Détails d'un capteur
      parameters:
        - $ref: "#/components/parameters/buildingId"
        - $ref: "#/components/parameters/zoneId"
        - $ref: "#/components/parameters/sensorId"
      responses:
        "200":
          description: Capteur trouvé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sensor"
        "404":
          description: Capteur, zone ou bâtiment inexistant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "503":
          description: Capteur hors ligne
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
    patch:
      tags: [Sensors]
      operationId: updateSensor
      summary: Mettre à jour le statut d'un capteur
      parameters:
        - $ref: "#/components/parameters/buildingId"
        - $ref: "#/components/parameters/zoneId"
        - $ref: "#/components/parameters/sensorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SensorPatchRequest"
      responses:
        "200":
          description: Capteur mis à jour avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sensor"
        "400":
          description: Données invalides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "404":
          description: Capteur, zone ou bâtiment inexistant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
    delete:
      tags: [Sensors]
      operationId: deleteSensor
      summary: Supprimer un capteur
      parameters:
        - $ref: "#/components/parameters/buildingId"
        - $ref: "#/components/parameters/zoneId"
        - $ref: "#/components/parameters/sensorId"
      responses:
        "204":
          description: Capteur supprimé avec succès
        "404":
          description: Capteur, zone ou bâtiment inexistant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"

  # ---------------------------------------------------------------------------
  # Measurements
  # ---------------------------------------------------------------------------

  /buildings/{buildingId}/zones/{zoneId}/sensors/{sensorId}/measurements:
    get:
      tags: [Measurements]
      operationId: listMeasurements
      summary: Lister les mesures d'un capteur
      parameters:
        - $ref: "#/components/parameters/buildingId"
        - $ref: "#/components/parameters/zoneId"
        - $ref: "#/components/parameters/sensorId"
      responses:
        "200":
          description: Mesures récupérées avec succès
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Measurement"
        "404":
          description: Capteur, zone ou bâtiment inexistant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "503":
          description: Capteur hors ligne — données indisponibles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
    post:
      tags: [Measurements]
      operationId: createMeasurement
      summary: Enregistrer une mesure
      description: Enregistre une mesure remontée par un capteur.
      parameters:
        - $ref: "#/components/parameters/buildingId"
        - $ref: "#/components/parameters/zoneId"
        - $ref: "#/components/parameters/sensorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeasurementRequest"
      responses:
        "201":
          description: Mesure enregistrée avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Measurement"
        "400":
          description: Données invalides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "404":
          description: Capteur, zone ou bâtiment inexistant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"

  # ---------------------------------------------------------------------------
  # Actuators
  # ---------------------------------------------------------------------------

  /buildings/{buildingId}/zones/{zoneId}/actuators:
    get:
      tags: [Actuators]
      operationId: listActuators
      summary: Lister les actionneurs d'une zone
      parameters:
        - $ref: "#/components/parameters/buildingId"
        - $ref: "#/components/parameters/zoneId"
      responses:
        "200":
          description: Actionneurs de la zone récupérés avec succès
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Actuator"
        "404":
          description: Zone ou bâtiment inexistant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
    post:
      tags: [Actuators]
      operationId: createActuator
      summary: Créer un actionneur dans une zone
      parameters:
        - $ref: "#/components/parameters/buildingId"
        - $ref: "#/components/parameters/zoneId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActuatorRequest"
      responses:
        "201":
          description: Actionneur créé avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Actuator"
        "400":
          description: Données invalides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "404":
          description: Zone ou bâtiment inexistant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"

  /buildings/{buildingId}/zones/{zoneId}/actuators/{actuatorId}:
    get:
      tags: [Actuators]
      operationId: getActuator
      summary: Détails d'un actionneur
      parameters:
        - $ref: "#/components/parameters/buildingId"
        - $ref: "#/components/parameters/zoneId"
        - $ref: "#/components/parameters/actuatorId"
      responses:
        "200":
          description: Actionneur trouvé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Actuator"
        "404":
          description: Actionneur, zone ou bâtiment inexistant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
    delete:
      tags: [Actuators]
      operationId: deleteActuator
      summary: Supprimer un actionneur
      parameters:
        - $ref: "#/components/parameters/buildingId"
        - $ref: "#/components/parameters/zoneId"
        - $ref: "#/components/parameters/actuatorId"
      responses:
        "204":
          description: Actionneur supprimé avec succès
        "404":
          description: Actionneur, zone ou bâtiment inexistant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"

  /buildings/{buildingId}/zones/{zoneId}/actuators/{actuatorId}/commands:
    post:
      tags: [Actuators]
      operationId: sendCommand
      summary: Envoyer une commande à un actionneur
      description: |
        Envoie une commande à un actionneur. Si l'actionneur est déjà dans l'état
        demandé, retourne `status: "no_change"` (idempotence). Retourne 503 si
        l'actionneur est en maintenance.
      parameters:
        - $ref: "#/components/parameters/buildingId"
        - $ref: "#/components/parameters/zoneId"
        - $ref: "#/components/parameters/actuatorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandRequest"
      responses:
        "200":
          description: Commande exécutée avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"
        "400":
          description: Action invalide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "404":
          description: Actionneur, zone ou bâtiment inexistant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "503":
          description: Actionneur en maintenance — commande refusée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"

# =============================================================================
# COMPONENTS
# =============================================================================

components:

  # ---------------------------------------------------------------------------
  # Security Schemes
  # ---------------------------------------------------------------------------

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # ---------------------------------------------------------------------------
  # Parameters
  # ---------------------------------------------------------------------------

  parameters:
    buildingId:
      name: buildingId
      in: path
      required: true
      description: Identifiant unique du bâtiment
      schema:
        type: string
    zoneId:
      name: zoneId
      in: path
      required: true
      description: Identifiant unique de la zone
      schema:
        type: string
    sensorId:
      name: sensorId
      in: path
      required: true
      description: Identifiant unique du capteur
      schema:
        type: string
    actuatorId:
      name: actuatorId
      in: path
      required: true
      description: Identifiant unique de l'actionneur
      schema:
        type: string
    measurementId:
      name: measurementId
      in: path
      required: true
      description: Identifiant unique de la mesure
      schema:
        type: string

  # ---------------------------------------------------------------------------
  # Schemas
  # ---------------------------------------------------------------------------

  schemas:

    # Auth
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          example: Admin1234!

    LoginResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Token JWT Bearer

    CreateUserRequest:
      type: object
      required: [username, password, role]
      properties:
        username:
          type: string
          example: Operateur1
        password:
          type: string
          example: Operateur1234!
        role:
          type: string
          enum: [admin, operator]
          example: operator
        zoneId:
          type: string
          description: Zone assignée à l'opérateur
          example: z-001

    User:
      type: object
      required: [id, username, role]
      properties:
        id:
          type: string
          example: u-001
        username:
          type: string
        role:
          type: string
          enum: [admin, operator]
        zoneId:
          type: string

    # Buildings
    Building:
      type: object
      required: [id, name, address, latitude, longitude]
      properties:
        id:
          type: string
          example: b-001
        name:
          type: string
          example: Siège Social ThermoSense
        address:
          type: string
          example: 42 rue des Tests, 69000 Lyon
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 45.7640
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 4.8357

    BuildingRequest:
      type: object
      required: [name, address, latitude, longitude]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Nouveau Bâtiment
        address:
          type: string
          minLength: 1
          maxLength: 200
          example: 42 rue des Tests, 69000 Lyon
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 45.7640
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 4.8357

    BuildingPatchRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        address:
          type: string
          minLength: 1
          maxLength: 200
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180

    # Zones
    Zone:
      type: object
      required: [id, buildingId, name]
      properties:
        id:
          type: string
          example: z-001
        buildingId:
          type: string
          example: b-001
        name:
          type: string
          example: Zone A — Open Space

    ZoneRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Zone D — Cafétéria

    # Sensors
    Sensor:
      type: object
      required: [id, type, status, zoneId]
      properties:
        id:
          type: string
          example: s-001
        type:
          type: string
          enum: [temperature, humidity, both]
        status:
          type: string
          enum: [active, faulty, maintenance]
        label:
          type: string
          description: Libellé descriptif du capteur
          example: Capteur mixte salle de conf
        zoneId:
          type: string
          example: z-001

    SensorRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [temperature, humidity, both]
          example: both
        label:
          type: string
          example: Capteur mixte test

    SensorPatchRequest:
      type: object
      properties:
        status:
          type: string
          enum: [active, faulty, maintenance]
          example: maintenance

    # Measurements
    Measurement:
      type: object
      required: [id, sensorId, type, value, unit, timestamp]
      properties:
        id:
          type: string
          example: meas-001
        sensorId:
          type: string
          example: s-001
        type:
          type: string
          enum: [temperature, humidity]
        value:
          type: number
          format: float
          example: 23.4
        unit:
          type: string
          example: "°C"
        timestamp:
          type: string
          format: date-time
          example: "2026-02-24T10:15:30Z"

    MeasurementRequest:
      type: object
      required: [type, value, unit]
      properties:
        type:
          type: string
          enum: [temperature, humidity]
          example: temperature
        value:
          type: number
          format: float
          example: 23.4
        unit:
          type: string
          example: "°C"

    # Actuators
    Actuator:
      type: object
      required: [id, type, status, zoneId]
      properties:
        id:
          type: string
          example: a-001
        type:
          type: string
          enum: [heating, cooling, ventilation]
        status:
          type: string
          enum: [on, off, auto, maintenance]
        label:
          type: string
          description: Libellé descriptif de l'actionneur
          example: Ventilation salle de conf
        zoneId:
          type: string
          example: z-001

    ActuatorRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [heating, cooling, ventilation]
          example: ventilation
        label:
          type: string
          example: Ventilation test

    CommandRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [on, off, auto]
          example: on

    CommandResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, no_change]
          description: |
            `ok` — commande appliquée.
            `no_change` — l'actionneur était déjà dans l'état demandé (idempotence).
          example: ok

    # Errors
    Errors:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Code d'erreur machine-readable
          example: DEVICE_UNAVAILABLE
        message:
          type: string
          description: Message d'erreur lisible pour le développeur
        details:
          type: array
          description: Détails supplémentaires (erreurs de validation par champ)
          items:
            type: object
            properties:
              field:
                type: string
              reason:
                type: string
