openapi: "3.0.3"

info:
  title: ThermoSense API
  version: "1.0.0"
  description: |
    API de gestion de la plateforme **ThermoSense** — supervision et pilotage
    du confort thermique dans des bâtiments tertiaires (bureaux, coworking, data centers).

    ThermoSense déploie des capteurs de température et d'humidité dans
    différentes zones d'un bâtiment afin de collecter des mesures en temps réel.
    Des actionneurs (ventilation, chauffage, climatisation) permettent
    d'ajuster les conditions thermiques à distance.

    L'application mobile permet aux opérateurs de :
    - Superviser l'état des bâtiments, zones, capteurs et actionneurs
    - Consulter l'historique des mesures
    - Configurer des seuils d'alerte
    - Piloter les équipements en temps réel

    ## Authentification
    Toutes les requêtes nécessitent un token Bearer dans le header
    `Authorization`.

    Les tokens sont obtenus via un flux OAuth2
    (non décrit dans ce contrat).

  contact:
    name: Équipe ThermoSense
    email: api@thermosense.example.com

servers:
  - url: https://api.thermosense.example.com/v1
    description: Production
  - url: https://staging-api.thermosense.example.com/v1
    description: Staging

tags:
  - name: Buildings
    description: Gestion des batiments et de leurs emplacements
  - name: Zones
    description: Gestion des zones et de leurs emplacements
  - name: Sensors
    description: Gestions des capteurs
  - name: Measurements
    description: Gestion des mesures des capteurs
  - name: Actuators
    description: Gestion des actionneurs et de leurs commandes

# =============================================================================
# PATHS
# =============================================================================

paths:
  # ---------------------------------------------------------------------------
  # Buildings
  # ---------------------------------------------------------------------------

  /buildings:
    post:
      tags: [Buildings]
      operationId: createBuildings
      summary: Créer un bâtiment
      description: |
        Créer un batiment avec son nom, son adresse, et sa géolocalisation.
      parameters:
        - name: name 
          in: query
          required: true
          description: Nom du bâtiment
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: adresse
          in: query
          required: true
          description: Adresse postale complète du bâtiment
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: latitude
          in: query
          required: true
          description: Latitude du point de recherche (WGS84)
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: longitude
          in: query
          required: true
          description: Longitude du point de recherche (WGS84)
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
      responses:
        "201":
          description: Bâtiment créé avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Buildings"
        "400":
          description: |
            Requête invalide — paramètres manquants ou invalides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
    get:
      tags: [Buildings]
      operationId: listBuildings
      summary: Lister les bâtiments à proximité
      description: |
        Retourne la liste des bâtiments situés à proximité du point de recherche
        spécifié, triés par distance croissante. Chaque bâtiment est résumé par
        son nom, son adresse, sa géolocalisation, et le nombre de places libres.
      parameters:
        - name: latitude
          in: query
          required: true
          description: Latitude du point de recherche (WGS84)
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: longitude
          in: query
          required: true
          description: Longitude du point de recherche (WGS84)
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
        - name: radiusMeters
          in: query
          required: false
          description: Rayon de recherche en mètres (défaut 1000m, max 10000m)
          schema:
            type: integer
            minimum: 100
            maximum: 10000
      responses:
        "200":
          description: Liste des bâtiments trouvés à proximité du point de recherche
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Buildings"
        "400":
          description: |
            Requête invalide — paramètres manquants ou invalides (ex : coordonnées hors limites)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"

  /buildings/{buildingId}:
    get:
      tags: [Buildings]
      operationId: getBuildingDetails
      summary: Détails d'un bâtiment
      description: |
        Retourne les détails d'un bâtiment : nom, adresse, géolocalisation.
      parameters:
        - $ref: "#/components/parameters/buildingId"
      responses:
        "200":
          description: Bâtiment trouvé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Buildings"
        "404":
          description: Bâtiment inexistant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
    patch:
      tags: [Buildings]
      operationId: updateBuilding
      summary: Mettre à jour les détails d'un bâtiment
      description: |
        Met à jour les détails d'un bâtiment existant : nom, adresse, géolocalisation.
      parameters:
        - $ref: "#/components/parameters/buildingId"
        - name: name 
          in: query
          required: false
          description: Nom du bâtiment
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: adresse
          in: query
          required: false
          description: Adresse postale complète du bâtiment
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: latitude
          in: query
          required: false
          description: Latitude du point de recherche (WGS84)
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: longitude
          in: query
          required: false
          description: Longitude du point de recherche (WGS84)
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
      responses:
        "200":
          description: Bâtiment mis à jour avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Buildings"
        "400":
          description: |
            Requête invalide — paramètres invalides ou aucun champ à mettre à jour fourni
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "404":
          description: Bâtiment inexistant — Aucun bâtiment trouvé avec l'identifiant spécifié
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"     
    delete:
      tags: [Buildings]
      operationId: deleteBuilding
      summary: Supprimer un bâtiment
      description: |
        Supprime un bâtiment existant. Cette opération est irréversible et supprimera
        également toutes les zones, capteurs, mesures et actionneurs associés à ce bâtiment.
      parameters:
        - $ref: "#/components/parameters/buildingId"
      responses:
        "204":
          description: Bâtiment supprimé avec succès
        "400":
          description: Requête invalide — Le buildingId est mal formé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "404":
          description: Bâtiment inexistant — Aucun bâtiment trouvé avec l'identifiant spécifié
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"   

  # ---------------------------------------------------------------------------
  # Zones
  # ---------------------------------------------------------------------------

  /buildings/{buildingId}/zones:
    get:
      tags: [Zones]
      operationId: listZones
      summary: Lister les zones d'un bâtiment
      description: |
        Retourne la liste des zones d'un bâtiment.
      parameters:
        - $ref: "#/components/parameters/buildingId"
      responses:
        "200":
          description: Liste des zones du bâtiment
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Zones"
        "403":
          description: Bâtiment inexistant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "404":
          description: Zone inexistante
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
    post:
      tags: [Zones]
      operationId: createZone
      summary: Créer une zone dans un bâtiment
      description: |
        Créer une zone dans un bâtiment existant.
      parameters:
        - $ref: "#/components/parameters/buildingId"
        - name: name
          in: query
          required: true
          description: Nom de la zone
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        "201":
          description: Zone créée avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zones"
        "400":
          description: Requête invalide — Le buildingId est mal formé ou le nom de la zone est manquant ou invalide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "404":
          description: Bâtiment inexistant — Aucun bâtiment trouvé avec l'identifiant spécifié
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"      
                
  /buildings/{buildingId}/zones/{zoneId}:
      get:
        tags: [Zones]
        operationId: getZoneDetails
        summary: Détails d'une zone
        description: |
          Retourne les détails d'une zone : nom, bâtiment liée.
        parameters:
          - $ref: "#/components/parameters/buildingId"
          - $ref: "#/components/parameters/zoneId"
        responses:
          "200":
            description: Zone trouvée
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Zones"
          "400":
            description: Requête invalide — Le buildingId ou zoneID est mal formé ou le nom de la zone est manquant ou invalide
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Errors"
          "404":
            description: Zone ou bâtiment inexistant
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Errors"
      patch:
        tags: [Zones]
        operationId: updateZone
        summary: Mettre à jour les détails d'une zone
        description: |
          Met à jour les détails d'une zone existante : nom.
        parameters:
          - $ref: "#/components/parameters/buildingId"
          - $ref: "#/components/parameters/zoneId"
          - name: name
            in: query
            required: false
            description: Nom de la zone
            schema:
              type: string
              minLength: 1
              maxLength: 100
        responses:
          "200":
            description: Zone mise à jour avec succès
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Zones"
          "400":
            description: Requête invalide — Le buildingId ou zoneId est mal formé ou aucun champ à mettre à jour fourni
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Errors"
          "404":
            description: Zone ou bâtiment inexistant — Aucun bâtiment ou zone trouvé avec les identifiants spécifiés
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Errors"
      delete:
        tags: [Zones]
        operationId: deleteZone
        summary: Supprimer une zone
        description: |
          Supprime une zone existante. Cette opération est irréversible et supprimera
          également tous les capteurs, mesures et actionneurs associés à cette zone.
        parameters:
          - $ref: "#/components/parameters/buildingId"
          - $ref: "#/components/parameters/zoneId"
        responses:
          "204":
            description: Zone supprimée avec succès
          "400":
            description: Requête invalide — Le buildingId ou zoneId est mal formé
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Errors"
          "404":
            description: Zone ou bâtiment inexistant — Aucun bâtiment ou zone trouvé avec les identifiants spécifiés
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Errors"  


  # ---------------------------------------------------------------------------
  # Sensor
  # ---------------------------------------------------------------------------
  /buildings/{buildingId}/zones/{zoneId}/sensors:
    get:
      tags: [Sensors]
      operationId: getSensorByZone
      summary: Récupère les capteurs d'une zone
      description:
        Récupères les capteurs d'une zone.
      parameters:
        - $ref: "#/components/parameters/buildingId"
        - $ref: "#/components/parameters/zoneId"
      responses:
        "200":
          description: Capteurs de la zone récupérés avec succès
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Sensors"
        "400":
          description: Requête invalide — Le buildingId ou zoneId est mal formé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "404":
          description: Zone ou bâtiment inexistant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
    post:
      tags: [Sensors]
      operationId: createSensor
      summary: Créer un capteur dans une zone
      description: |
        Créer un capteur dans une zone existante.
      parameters:
        - $ref: "#/components/parameters/buildingId"
        - $ref: "#/components/parameters/zoneId"
        - name: type
          in: query
          required: true
          description: Type du capteur (température, humidité, ou les deux)
          schema:
            type: string
            enum: [temperature, humidity, both]
      responses:
        "201":
          description: Capteur créé avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sensors"
        "400":
          description: Requête invalide - Le buildingId ou zoneId est mal formé ou le type du capteur est manquant ou invalide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "404":
          description: Zone ou bâtiment inexistant - Aucun bâtiment ou zone trouvé avec les identifiants spécifiés
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
                
  /buildings/{buildingId}/zones/{zoneId}/sensors/{sensorId}:
    get:
      tags: [Sensors]
      operationId: getSensorDetails
      summary: Détails d'un capteur
      description: |
        Retourne les détails d'un capteur : type, zone liée, état de fonctionnement.
      parameters:
        - $ref: "#/components/parameters/buildingId"
        - $ref: "#/components/parameters/zoneId"
        - $ref: "#/components/parameters/sensorId"
      responses:
        "200":
          description: Capteur trouvé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sensors"
        "400":
          description: Requête invalide — Le buildingId, zoneId ou sensorId est mal formé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "404":
          description: Capteur, zone ou bâtiment inexistant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
    patch:
      tags: [Sensors]
      operationId: updateSensor
      summary: Mettre à jour les détails d'un capteur
      description: |
        Met à jour les détails d'un capteur existant : type, état de fonctionnement.
      parameters:
        - $ref: "#/components/parameters/buildingId"
        - $ref: "#/components/parameters/zoneId"
        - $ref: "#/components/parameters/sensorId"
        - name: type
          in: query
          required: false
          description: Type du capteur (température, humidité, ou les deux)
          schema:
            type: string
            enum: [temperature, humidity, both]
        - name: state
          in: query
          required: false
          description: État de fonctionnement du capteur (actif, en panne, en maintenance)
          schema:
            type: string
            enum: [active, faulty, maintenance]
      responses:
        "200":
          description: Capteur mis à jour avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sensors"
        "400":
          description: Requête invalide — Le buildingId, zoneId ou sensorId est mal formé ou aucun champ à mettre à jour fourni ou type ou state invalide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "404":
          description: Capteur, zone ou bâtiment inexistant — Aucun bâtiment, zone ou capteur trouvé avec les identifiants spécifiés
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
    delete:
      tags: [Sensors]
      operationId: deleteSensor
      summary: Supprimer un capteur
      description: |
        Supprtime un capteur existant dans une zone d'un bâtiment.
      parameters:
        - $ref: "#/components/parameters/buildingId"
        - $ref: "#/components/parameters/zoneId"
        - $ref: "#/components/parameters/sensorId"
      responses:
        "204":
          description: Capteur supprimé avec succès
        "400":
          description: Requête invalide — Le buildingId, zoneId ou sensorId est mal formé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "404":
          description: Capteur, zone ou bâtiment inexistant — Aucun bâtiment, zone ou capteur trouvé avec les identifiants spécifiés
          content: 
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
  # ---------------------------------------------------------------------------
  # Measurements
  # ---------------------------------------------------------------------------
  /buildings/{buildingId}/zones/{zoneId}/sensors/{sensorId}/measurements:
    post:
      tags:
        - Measurements
      operationId: createMeasurement
      description: Enregistre une mesure remontée par un capteur.
      parameters:
        - $ref: "#/components/parameters/buildingId"
        - $ref: "#/components/parameters/zoneId"
        - $ref: "#/components/parameters/sensorId"
        - name: name
          in: query
          description: Nom de la mesure
          schema:
            type: string
            minLength: 1
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Measurements"
      responses:
        "201":
          description: Mesure créée avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Measurements"
        "400":
          description: Données invalides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
                

  # ---------------------------------------------------------------------------
  # Actuators
  # ---------------------------------------------------------------------------

  /building/{buildingId}/zones/{zoneId}/actuators:
    get:
      tags: [Actuators]
      operationId: getActuatorsByZone
      summary: Récupère les actionneurs d'une zone
      description:
        Récupères les actionneurs d'une zone.
      parameters:
        - $ref: "#/components/parameters/buildingId"
        - $ref: "#/components/parameters/zoneId"
      responses:
        "200":
          description: Actionneurs de la zone récupérés avec succès
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Actuators"
                    
        "400":
          description: Requête invalide — Le buildingId ou zoneId est mal formé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "404":
          description: Zone ou bâtiment inexistant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"

  
# =============================================================================
# COMPONENTS
# =============================================================================

components:
  # ---------------------------------------------------------------------------
  # Parameters
  # ---------------------------------------------------------------------------

  parameters:
    buildingId:
      name: buildingId
      in: path
      required: true
      description: Identifiant unique du bâtiment
      schema:
        type: string
        format: uuid
    zoneId:
      name: zoneId
      in: path
      required: true
      description: Identifiant unique de la zone
      schema:
        type: string
        format: uuid
    sensorId:
      name: sensorId
      in: path
      required: true
      description: Identifiant unique du capteur
      schema:
        type: string
        format: uuid
    measurementId:
      name: measurementId
      in: path
      required: true
      description: Identifiant unique de la mesure
      schema:
        type: string
        format: uuid

  # ---------------------------------------------------------------------------
  # Schemas
  # ---------------------------------------------------------------------------

  schemas:
    Buildings:
      type: object
      description:  Un building (adresse, nom, géolocalisation).
      required:
        - id
        - name
        - addresse
        - latitude
        - longitude
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Nom du batiment
        latitude:
           $ref: "#/components/schemas/GeoPoints"
        longitude:
          $ref: "#/components/schemas/GeoPoints"    

    Zones:
      type: object
      description:  Une zone (building, nom).
      required:
        - id
        - buildingId
        - name
      properties:
        id:
          type: string
          format: uuid
        buildingId:
          type: string
          format: uuid
          description: Id du building dans lequel se trouve la zone
        name:
          type: string
          description: Nom de la zone

    Sensors:    
      type: object
      description: Un dispositif matériel fixé dans une zone. 
      required: 
        - id
        - type
        - state
        - zoneId
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          description: température, humidité, ou les deux  
        state:
          type: string  
          description: un statut opérationnel (actif, en panne, en maintenance)
        zoneId:
          type: string
          format: uuid
          description: Id de la zone dans lequel se trouve le capteur

    Measurements:
      type: object
      required:
        - id
        - sensorId
        - type
        - value
        - unit
        - timestamp
      properties:
        id:
          type: string
          example: "meas_98765"
        sensorId:
          type: string
          example: "sensor_123"
        type:
          type: string
          enum: [temperature, humidity]
        value:
          type: number
          format: float
          example: 27.4
        unit:
          type: string
          example: "°C"
        timestamp:
          type: string
          format: date-time
          example: "2026-02-24T10:15:30Z"
          
    Actuators:
      type: object
        
    GeoPoints:
      type: object
      description: Coordonnées géographiques (WGS84)
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          
    Errors:
      type: object
      description: Réponse d'erreur standardisée
      required: [code, message]
      properties:
        code:
          type: string
          description: Code d'erreur machine-readable (ex "INVALID_COORDINATES")
        message:
          type: string
          description: Message d'erreur lisible pour le développeur
        details:
          type: array
          description: Détails supplémentaires (erreurs de validation par champ)
          items:
            type: object
            properties:
              field:
                type: string
              reason:
                type: string